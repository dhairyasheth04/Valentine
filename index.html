<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💖</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Comic Sans MS', cursive;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
      position: relative;
      max-width: 320px;
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 25px;
    }

    .buttons {
      margin-top: 20px;
    }

    /* YES BUTTON – BIG & CUTE */
    #yesBtn {
      padding: 15px 40px;
      font-size: 22px;
      background-color: #ff4d6d;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin-right: 10px;
    }

    /* NO BUTTON – SMALL & SNEAKY */
    #noBtn {
      padding: 5px 12px;
      font-size: 12px;
      background-color: #ccc;
      border: none;
      border-radius: 20px;
      position: absolute;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>
      Hey Pingu 🐧💖<br>
      Will you be my Valentine for the 5th year as well?
    </h1>

    <div class="buttons">
      <button id="yesBtn" onclick="sayYes()">Yes 💕</button>
      <button id="noBtn" onmouseover="moveNo()">No 🙈</button>
    </div>
  </div>

  <script>
    function moveNo() {
      const noBtn = document.getElementById("noBtn");
      const x = Math.random() * (window.innerWidth - 80);
      const y = Math.random() * (window.innerHeight - 80);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    function sayYes() {
      document.querySelector(".card").innerHTML = `
        <h1>Yayyyyy 💖💖💖</h1>
        <p>You’re forever my Valentine, Pingu 🐧</p>
        <div style="font-size:40px; margin-top:20px;">
          🧸💝💍💖💞🌹
        </div>
      `;
    }
  </script>

</body>
</html>
